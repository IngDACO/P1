name: Ping Streamlit on Push

on:
  push:
    branches: [main]
    paths: ['survey_app/**']

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Streamlit to detect changes
        run: sleep 45

      - name: Ping app to trigger reload
        run: |
          curl -s -o /dev/null -w "HTTP Status: %{http_code}" \
            https://dwl6s39d7u3yfwfkbpcpah.streamlit.app/
          echo " - App pinged successfully"
